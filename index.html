<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lịch Lễ Sinh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EDE0;
    --surface:#FFFDF8;
    --surface-2:#EFE7D4;
    --ink:#2A231C;
    --ink-soft:#7A6F5F;
    --primary:#7A2331;
    --primary-dark:#5C1A25;
    --gold:#B8923F;
    --sage:#5C7A5E;
    --border:#DED2B8;
    --danger:#A33B3B;
    --radius-s:8px;
    --radius-m:14px;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;width:100%;max-width:100vw;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Centered screens (setup/login) ---------- */
  .center-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px;}
  .arch-wrap{position:relative;width:100%;max-width:380px;}
  .arch-glow{position:absolute;top:-46px;left:50%;transform:translateX(-50%);width:64px;height:64px;}
  .arch-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:120px 120px 16px 16px;
    padding:64px 32px 32px;
    box-shadow:0 20px 40px -20px rgba(42,35,28,0.25);
    text-align:center;
  }
  .arch-card h1{font-size:22px;margin:0 0 4px;color:var(--primary-dark);}
  .arch-card p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 24px;}
  .field{text-align:left;margin-bottom:14px;}
  .field > label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em;}
  .field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-s);background:#fff;font-size:14px;color:var(--ink);}
  .field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .btn{padding:11px 18px;border-radius:var(--radius-s);border:none;font-weight:600;font-size:14px;transition:transform .08s ease;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--primary);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent;color:var(--primary);border:1px solid var(--border);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .error-text{color:var(--danger);font-size:13px;margin:0 0 12px;}
  .hint-text{color:var(--ink-soft);font-size:12px;margin-top:16px;line-height:1.5;}

  /* ---------- App shell ---------- */
  .topbar{background:var(--primary);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .topbar .brand{display:flex;align-items:center;gap:10px;}
  .topbar .brand svg{flex-shrink:0;}
  .topbar h1{font-size:19px;color:#fff;margin:0;cursor:default;}
  .topbar .who{font-size:12.5px;opacity:0.85;}
  .topbar-actions{display:flex;align-items:center;gap:8px;position:relative;}
  .topbar-actions button{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:7px 12px;border-radius:var(--radius-s);font-size:12.5px;font-weight:600;}
  .topbar-actions button:hover{background:rgba(255,255,255,0.22);}
  .menu-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;padding:0!important;}
  .menu-overlay{position:fixed;inset:0;z-index:40;background:transparent;}
  .menu-dropdown{position:absolute;top:46px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:0 12px 30px -10px rgba(42,35,28,0.35);min-width:200px;overflow:hidden;z-index:41;}
  .menu-dropdown button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:12px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);}
  .menu-dropdown button:last-child{border-bottom:none;color:var(--danger);}
  .menu-dropdown button:hover{background:var(--surface-2);}

  main{flex:1;max-width:1100px;margin:0 auto;padding:24px 18px 60px;width:100%;}

  .month-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:18px;}
  .month-nav h2{margin:0;font-size:22px;min-width:200px;text-align:center;color:var(--primary-dark);}
  .month-nav button{background:var(--surface);border:1px solid var(--border);width:36px;height:36px;border-radius:50%;font-size:16px;color:var(--primary);}
  .month-nav button:hover{background:var(--surface-2);}

  .content-grid{display:flex;gap:22px;align-items:flex-start;}
  .calendar-col{flex:1;min-width:0;}
  .detail-col{width:320px;flex-shrink:0;}
  @media (max-width:820px){.content-grid{flex-direction:column;align-items:stretch;}.detail-col{width:100%;}.calendar-col{width:100%;}}

  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .weekdays div{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);min-height:82px;padding:6px;text-align:left;position:relative;display:flex;flex-direction:column;gap:3px;}
  .cal-cell.empty{background:transparent;border-color:transparent;}
  .cal-cell.selected{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary) inset;}
  .cal-cell .datenum{font-size:13px;font-weight:600;color:var(--ink);}
  .cal-cell.today .datenum{color:var(--primary);}
  .cal-cell .flame{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px rgba(184,146,63,0.25);}
  .cal-cell .chip{font-size:10.5px;background:var(--surface-2);color:var(--ink-soft);border-radius:5px;padding:2px 5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-cell.has-me .chip.mine{background:var(--sage);color:#fff;}
  .cal-cell:hover{cursor:pointer;border-color:var(--gold);}
  .cal-cell .special-tag{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,0.7);color:var(--ink);align-self:flex-start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

  /* ---------- Thông báo lịch giúp lễ ---------- */
  .notice-banner{background:var(--surface);border:1px solid var(--gold);border-left:4px solid var(--gold);border-radius:var(--radius-m);padding:14px 16px;margin-bottom:18px;}
  .notice-banner .notice-title{font-weight:700;color:var(--primary-dark);font-size:14px;margin-bottom:6px;}
  .notice-banner .notice-item{font-size:13.5px;color:var(--ink);padding:3px 0;}

  /* ---------- Ngày đặc biệt ---------- */
  .special-note-box{border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--ink);}
  .color-swatch{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);padding:0;flex-shrink:0;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;}
  .panel h3{margin:0 0 4px;font-size:17px;color:var(--primary-dark);}
  .panel .panel-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;}
  .mass-item{border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:10px;}
  .mass-item .mass-time{font-weight:700;font-size:14px;color:var(--primary);font-family:'JetBrains Mono',monospace;}
  .mass-item .mass-note{font-size:12px;color:var(--ink-soft);margin:2px 0 8px;}
  .name-tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:20px;padding:3px 9px 3px 9px;font-size:12px;margin:0 5px 5px 0;}
  .name-tag button{background:none;border:none;color:var(--danger);font-size:13px;padding:0;line-height:1;}
  .empty-note{color:var(--ink-soft);font-size:13px;text-align:center;padding:24px 8px;}

  .checklist{max-height:180px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--border);border-radius:var(--radius-s);padding:8px;margin-bottom:12px;}
  .checklist label{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:6px 2px;width:100%;box-sizing:border-box;}
  .checklist label input[type="checkbox"]{flex:0 0 auto;width:16px;height:16px;margin:2px 0 0;}
  .checklist label .cl-name{flex:1 1 0%;min-width:0;line-height:1.4;overflow-wrap:break-word;word-break:break-word;}
  .checklist label .cl-name .mono{white-space:nowrap;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;}
  .role-badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:0.03em;}
  .role-admin{background:var(--primary);color:#fff;}
  .role-support{background:var(--gold);color:#fff;}
  .role-le_sinh{background:var(--surface-2);color:var(--ink-soft);}
  .role-custom{background:var(--sage);color:#fff;}
  .perm-chip{display:inline-block;font-size:10.5px;background:var(--surface-2);color:var(--ink-soft);border-radius:20px;padding:2px 8px;margin:0 4px 4px 0;}
  .role-item{border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:10px;}
  .role-item .role-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .role-item .role-item-name{font-weight:700;font-size:14px;color:var(--primary-dark);}
  select.role-select{padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-s);background:#fff;font-size:12.5px;color:var(--ink);}

  .modal-overlay{position:fixed;inset:0;background:rgba(42,35,28,0.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal-box{background:var(--surface);border-radius:var(--radius-m);padding:22px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
  .modal-box h3{margin-top:0;color:var(--primary-dark);}
  .row-btns{display:flex;gap:10px;margin-top:16px;}
  .row-btns .btn{flex:1;}
  .top-actions-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .loading-note{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:100;max-width:90vw;text-align:center;}

  .cal-cell .mobile-dots{display:none;gap:3px;flex-wrap:wrap;margin-top:auto;}
  .cal-cell .mobile-dots .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;}
  .cal-cell.has-me .mobile-dots .dot.mine{background:var(--sage);}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* ---------- Mobile ---------- */
  @media (max-width:600px){
    .center-screen{padding:20px 12px;}
    .arch-card{padding:52px 20px 22px;border-radius:90px 90px 14px 14px;}
    .arch-card h1{font-size:20px;}

    .topbar{padding:9px 14px;}
    .topbar .brand{gap:8px;}
    .topbar .brand svg{width:26px;height:26px;}
    .topbar h1{font-size:15px;}
    .topbar .who{font-size:10.5px;}
    .topbar-actions > button{padding:6px 10px;font-size:11px;}
    .menu-btn{width:34px;height:34px;padding:0!important;}
    .menu-dropdown button{padding:12px 14px;font-size:13.5px;}

    main{padding:10px 8px 30px;}

    .month-nav{gap:10px;margin-bottom:8px;}
    .month-nav h2{font-size:17px;min-width:0;}
    .month-nav button{width:28px;height:28px;font-size:14px;}

    .weekdays{margin-bottom:4px;}
    .weekdays div{font-size:11px;font-weight:800;}
    .cal-grid{gap:4px;}
    .cal-cell{min-height:60px;padding:5px 4px;border-radius:8px;gap:3px;}
    .cal-cell .datenum{font-size:15px;}
    .cal-cell .chip{display:none;}
    .cal-cell .special-tag{font-size:8px;padding:1px 4px;}
    .cal-cell .mobile-dots{display:flex;gap:4px;}
    .cal-cell .mobile-dots .dot{width:7px;height:7px;}
    .cal-cell .flame{width:7px;height:7px;top:4px;right:4px;}

    .panel{padding:16px;}
    .panel h3{font-size:17px;}
    .mass-item{padding:11px 12px;}
    .mass-item .mass-time{font-size:15px;}
    .name-tag{font-size:13px;padding:4px 10px;}

    .modal-box{padding:18px;}
    .row-btns{flex-direction:column;}
    .row-btns .btn{padding:12px 16px;font-size:14px;}
    .top-actions-row{flex-direction:column;align-items:stretch;}
    .top-actions-row .btn{width:100%;}

    table{font-size:13px;}
    th,td{padding:8px 9px;white-space:nowrap;}
  }

  /* ---------- RGB sliders (ngày đặc biệt) ---------- */
  .rgb-box{margin-top:10px;border:1px solid var(--border);border-radius:var(--radius-s);padding:12px;background:var(--surface-2);}
  .rgb-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .rgb-row:last-child{margin-bottom:0;}
  .rgb-row .rgb-label{width:16px;font-size:12px;font-weight:700;color:var(--ink-soft);}
  .rgb-row input[type="range"]{flex:1;accent-color:var(--primary);}
  .rgb-row .rgb-val{width:32px;text-align:right;font-size:12px;color:var(--ink-soft);}
  .rgb-row.r input[type="range"]{accent-color:#C1443F;}
  .rgb-row.g input[type="range"]{accent-color:#4F8F5A;}
  .rgb-row.b input[type="range"]{accent-color:#3E6FB0;}
  .rgb-preview{width:100%;height:30px;border-radius:8px;border:1px solid var(--border);margin-top:10px;}

  /* ---------- Thư báo: phong bì ---------- */
  .envelope-overlay{position:fixed;inset:0;background:rgba(42,35,28,0.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;}
  .envelope-wrap{width:100%;max-width:340px;animation:popIn .35s ease;}
  @keyframes popIn{from{opacity:0;transform:scale(0.9) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .envelope-card{position:relative;background:var(--surface);border-radius:18px;box-shadow:0 30px 60px -20px rgba(42,35,28,0.55);overflow:hidden;text-align:center;padding:0 0 28px;border:1px solid var(--border);}
  .envelope-top{position:relative;}
  .envelope-flap{position:relative;width:100%;height:150px;background:linear-gradient(135deg,var(--primary),var(--primary-dark) 60%,#451420);clip-path:polygon(0 0,100% 0,50% 78%);}
  .envelope-rainbow{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--gold),#E7C878,var(--gold),#D9A94A);}
  .envelope-seal{width:72px;height:72px;border-radius:50%;background:var(--surface);border:3px solid var(--gold);position:absolute;left:50%;top:114px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -6px rgba(42,35,28,0.4);}
  .envelope-seal svg{width:38px;height:38px;}
  .envelope-body{padding:48px 24px 0;}
  .envelope-body .env-title{font-family:'Fraunces',serif;font-weight:700;font-size:17px;color:var(--primary-dark);margin:0 0 4px;}
  .envelope-body .env-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 20px;}
  .env-open-btn{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;border-radius:24px;padding:12px 30px;font-weight:700;font-size:13.5px;width:100%;box-shadow:0 10px 20px -8px rgba(122,35,49,0.55);display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .env-open-btn:hover{filter:brightness(1.08);}
  .env-count{font-size:11.5px;color:var(--ink-soft);margin-top:12px;}

  /* ---------- Thư báo: nội dung thư ---------- */
  .letter-overlay{position:fixed;inset:0;background:rgba(42,35,28,0.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;overflow-y:auto;}
  .letter-card{width:100%;max-width:400px;background:linear-gradient(180deg,#FFFDF6,#FBF7EA);border:1px solid #E9DFC4;border-radius:20px;padding:30px 26px 26px;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,0.45);position:relative;margin:auto;}
  .letter-corner{position:absolute;width:22px;height:22px;border:2px solid var(--gold);opacity:0.55;}
  .letter-corner.tl{top:10px;left:10px;border-right:none;border-bottom:none;}
  .letter-corner.tr{top:10px;right:10px;border-left:none;border-bottom:none;}
  .letter-corner.bl{bottom:10px;left:10px;border-right:none;border-top:none;}
  .letter-corner.br{bottom:10px;right:10px;border-left:none;border-top:none;}
  .letter-line{opacity:0;animation:lineDown .5s ease forwards;}
  @keyframes lineDown{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}
  .letter-badge{display:inline-block;background:linear-gradient(90deg,#F6A93B,#F08A2C);color:#fff;font-weight:700;font-size:11.5px;letter-spacing:0.04em;padding:6px 16px;border-radius:20px;margin-bottom:16px;}
  .letter-avatar{width:82px;height:82px;border-radius:50%;margin:0 auto 14px;border:3px solid #F6C453;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:26px;color:var(--primary);overflow:hidden;}
  .letter-avatar img{width:100%;height:100%;object-fit:cover;}
  .letter-deco{color:var(--gold);font-size:13px;margin:0 0 8px;letter-spacing:0.15em;}
  .letter-subtitle{font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;margin:0 0 4px;}
  .letter-name{font-family:'Fraunces',serif;font-weight:700;font-size:21px;color:var(--primary-dark);margin:0 0 14px;line-height:1.3;}
  .letter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--ink);font-size:12px;font-weight:600;padding:5px 14px;border-radius:20px;margin-bottom:16px;}
  .letter-rows{text-align:left;max-width:260px;margin:0 auto 14px;}
  .letter-rows .lr{display:flex;justify-content:space-between;gap:14px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--border);}
  .letter-rows .lr .lr-label{color:var(--ink-soft);}
  .letter-rows .lr .lr-value{font-weight:600;color:var(--ink);text-align:right;}
  .letter-message{font-size:12.5px;color:var(--ink-soft);font-style:italic;line-height:1.6;margin:6px 0 20px;}
  .letter-confirm-btn{background:linear-gradient(90deg,#F6A93B,#F08A2C);color:#fff;border:none;border-radius:24px;padding:12px 28px;font-weight:700;font-size:13.5px;width:100%;}
  .letter-confirm-btn:hover{filter:brightness(1.05);}
  .letter-from{font-size:11px;color:var(--ink-soft);margin-top:12px;}

  /* ---------- Hộp thư / soạn thư ---------- */
  .mail-item{border:1px solid var(--border);border-radius:var(--radius-s);padding:12px 14px;margin-bottom:10px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;}
  .mail-item:hover{border-color:var(--gold);}
  .mail-item.unread{border-left:4px solid var(--gold);}
  .mail-item .mail-title{font-weight:700;font-size:13.5px;color:var(--ink);}
  .mail-item .mail-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .mail-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;}
  .letter-row-edit{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .letter-row-edit input{flex:1;}
  .letter-row-edit button{flex-shrink:0;background:none;border:none;color:var(--danger);font-size:16px;padding:4px;}
  .topbar-actions .envelope-btn{position:relative;}
  .topbar-actions .envelope-btn .unread-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#F08A2C;border:2px solid var(--primary);}
  .envelope-overlay-wrap{display:contents;}
</style>
</head>
<body>
<div id="app"><div class="loading-note">Đang tải…</div></div>

<script type="module">
  /* ============================================================
     ★★★ DÁN CẤU HÌNH FIREBASE CỦA BẠN VÀO ĐÂY ★★★

const WEEKDAYS = ['T2','T3','T4','T5','T6','T7','CN'];
const WEEKDAY_FULL = ['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
const MONTH_NAMES = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
const pad = n => String(n).padStart(2,'0');
const dateKey = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const todayKey = () => { const t=new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); };
const uid = () => Math.random().toString(36).slice(2,9);

/* ---------------- Vai trò & phân quyền tuỳ chỉnh ---------------- */

];
function permLabel(key){ const p = PERMISSIONS.find(p=>p.key===key); return p ? p.label : key; }
function hasPerm(key, user){
  const u = user || S.currentUser;
  if(!u) return false;
  if(u.vaiTro === 'admin') return true;
  if(key === 'hoTro' && u.quyenHoTro === true) return true;
  const role = u.vaiTroId && S.roles ? S.roles[u.vaiTroId] : null;
  return !!(role && role.quyen && role.quyen[key]);
}

function showToast(msg){ S.toast = msg; render(); setTimeout(()=>{ S.toast=''; render(); }, 2200); }

/* ---------------- Phiên đăng nhập (tự động đăng nhập lại trong 1 ngày) ---------------- */
const SESSION_KEY = 'leSinhSession';
const SESSION_DURATION_MS = 24 * 60 * 60 * 1000; // 1 ngày

function saveSession(maSo){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({ maSo, expiresAt: Date.now() + SESSION_DURATION_MS }));
  }catch(e){ /* trình duyệt chặn localStorage, bỏ qua */ }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data || !data.maSo || !data.expiresAt) return null;
    if(Date.now() > data.expiresAt){ clearSession(); return null; }
    return data;
  }catch(e){ return null; }
}

/* ---------------- Nhật ký đăng nhập (chỉ Trưởng ban lễ sinh xem được) ---------------- */
async function fetchClientIp(){
  try{
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4000);
    const res = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
    clearTimeout(timeoutId);
    if(!res.ok) return null;
    const data = await res.json();
    return data.ip || null;
  }catch(e){ return null; }
}

async function recordLoginLog(maSo){
  const ip = await fetchClientIp();
  const u = S.users[maSo];
  const entry = {
    id: uid(),
    maSo,
    hoTen: u ? u.hoTen : maSo,
    thoiGian: Date.now(),
    thietBi: navigator.userAgent,
    ip: ip || 'Không xác định'
  };
  S.loginLogs = S.loginLogs || [];
  S.loginLogs.unshift(entry);
  if(S.loginLogs.length > 300) S.loginLogs.length = 300; // giới hạn để tránh phình dữ liệu
  await safeSet('loginLogs', S.loginLogs, true);
  if(S.view === 'loginLogs') render();
}

async function safeGet(key){
  try{
    const data = await window.dbGet(key);
    return data;
  }catch(e){ console.error(e); return null; }
}
async function safeSet(key, value){
  try{
    await window.dbSet(key, value);
    return true;
  }catch(e){ console.error(e); return false; }
}

/* ---------------- Thông báo lịch giúp lễ trong tuần (Thứ 2 - Chủ Nhật) ---------------- */
function getUpcomingMassesThisWeek(){
  if(!S.currentUser || !S.schedule) return [];
  const now = new Date();
  const jsDay = now.getDay(); // 0=CN..6=T7
  const diffToMonday = (jsDay === 0 ? -6 : 1 - jsDay);
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday);
  const results = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    const key = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    const masses = S.schedule[key] || [];
    masses.forEach(m => {
      if(!m.lezSinh || !m.lezSinh.includes(S.currentUser.maSo)) return;
      const parts = (m.gio || '00:00').split(':');
      const hh = Number(parts[0]) || 0, mm = Number(parts[1]) || 0;
      const massTime = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm);
      if(massTime.getTime() > now.getTime()){
        results.push({ key, day:d.getDate(), month:d.getMonth()+1, weekdayIdx:i, gio:m.gio, ghiChu:m.ghiChu, massTime });
      }
    });
  }
  results.sort((a,b) => a.massTime - b.massTime);
  return results;
}

function renderUpcomingNotice(){
  if(!S.currentUser) return '';
  const list = getUpcomingMassesThisWeek();
  if(list.length === 0) return '';
  const items = list.map(it => `<div class="notice-item">🔔 ${WEEKDAY_FULL[it.weekdayIdx]} (${it.day}/${it.month}) lúc ${it.gio}${it.ghiChu ? ' · ' + it.ghiChu : ''}</div>`).join('');
  return `<div class="notice-banner">
    <div class="notice-title">Bạn có lịch giúp lễ trong tuần này</div>
    ${items}
  </div>`;
}

/* ---------------- Calendar helpers ---------------- */
function changeMonth(delta){
  let m = S.calMonth + delta, y = S.calYear;
  if(m < 0){ m = 11; y--; } else if(m > 11){ m = 0; y++; }
  S.calMonth = m; S.calYear = y; S.selectedDate = null;
  render();
}

function buildCalendarCells(){
  const y = S.calYear, m = S.calMonth;
  const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
  const offset = (firstDay + 6) % 7; // Monday-first offset
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const cells = [];
  for(let i=0;i<offset;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}

/* Chuyển đổi màu HEX <-> RGB để phục vụ 3 thanh trượt kéo màu */
function hexToRgb(hex){
  hex = (hex || '#000000').replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex, 16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex(r,g,b){
  const c = n => Math.max(0,Math.min(255, n)).toString(16).padStart(2,'0');
  return `#${c(r)}${c(g)}${c(b)}`;
}
function syncSlidersFromColorInput(){
  const colorInput = document.querySelector('#specialDayForm input[name="mau"]');
  if(!colorInput) return;
  const { r, g, b } = hexToRgb(colorInput.value);
  const rEl = document.getElementById('sdR'), gEl = document.getElementById('sdG'), bEl = document.getElementById('sdB');
  if(rEl) rEl.value = r; if(gEl) gEl.value = g; if(bEl) bEl.value = b;
  const rv = document.getElementById('sdRVal'), gv = document.getElementById('sdGVal'), bv = document.getElementById('sdBVal');
  if(rv) rv.textContent = r; if(gv) gv.textContent = g; if(bv) bv.textContent = b;
  const preview = document.getElementById('sdPreview');
  if(preview) preview.style.background = colorInput.value;
}
function updateColorFromSliders(){
  const r = Number(document.getElementById('sdR').value);
  const g = Number(document.getElementById('sdG').value);
  const b = Number(document.getElementById('sdB').value);
  const hex = rgbToHex(r,g,b);
  const colorInput = document.querySelector('#specialDayForm input[name="mau"]');
  if(colorInput) colorInput.value = hex;
  document.getElementById('sdRVal').textContent = r;
  document.getElementById('sdGVal').textContent = g;
  document.getElementById('sdBVal').textContent = b;
  const preview = document.getElementById('sdPreview');
  if(preview) preview.style.background = hex;
}

/* ---------------- Thư báo (chỉ Trưởng ban lễ sinh được gửi) ---------------- */
function getMyLetters(){
  if(!S.currentUser || !S.letters) return [];
  return S.letters.filter(l => l.nguoiNhan === 'all' || (l.nguoiNhan || []).includes(S.currentUser.maSo))
    .sort((a,b) => b.ngayTao - a.ngayTao);
}
function isLetterRead(l){ return !!(l.daXemBoi || []).includes(S.currentUser.maSo); }
function checkPendingLetters(){
  if(!S.currentUser || S.modal) return;
  const unread = getMyLetters().filter(l => !isLetterRead(l)).sort((a,b) => a.ngayTao - b.ngayTao);
  if(unread.length > 0){
    S.modal = { type:'letterEnvelope', letterId: unread[0].id, queue: unread.slice(1).map(l=>l.id) };
  }
}
function openLetterFromQueue(){
  const q = (S.modal && S.modal.queue) || [];
  if(q.length > 0){
    S.modal = { type:'letterEnvelope', letterId: q[0], queue: q.slice(1) };
  } else {
    S.modal = null;
  }
  render();
}
function openLetterView(){
  S.modal = { type:'letterOpen', letterId: S.modal.letterId, queue: S.modal.queue || [] };
  render();
}
async function confirmLetter(){
  const letter = (S.letters || []).find(l => l.id === (S.modal && S.modal.letterId));
  if(letter && !isLetterRead(letter)){
    letter.daXemBoi = letter.daXemBoi || [];
    letter.daXemBoi.push(S.currentUser.maSo);
    await safeSet('letters', S.letters, true);
  }
  openLetterFromQueue();
}
function openMyLetters(){ S.view = 'myLetters'; S.modal = null; render(); }
function reopenLetter(letterId){
  S.modal = { type:'letterOpen', letterId, queue: [] };
  render();
}
function closeLetterView(){
  const letter = (S.letters || []).find(l => l.id === (S.modal && S.modal.letterId));
  if(letter && !isLetterRead(letter)){
    letter.daXemBoi = letter.daXemBoi || [];
    letter.daXemBoi.push(S.currentUser.maSo);
    safeSet('letters', S.letters, true);
  }
  const q = (S.modal && S.modal.queue) || [];
  if(q.length > 0){ S.modal = { type:'letterEnvelope', letterId: q[0], queue: q.slice(1) }; }
  else { S.modal = null; }
  render();
}

function openComposeLetter(){
  if(!hasPerm('guiThu')) return;
  S.modal = { type:'composeLetter', recipientMode:'all', chosen:[], rows:[],
    nhan:'THÔNG BÁO', tieuDePhu:'', tenChinh:'', chip:'', loiNhan:'', nutXacNhan:'Đã nhận thông báo' };
  render();
}
function setLetterRecipientMode(mode){
  S.modal.recipientMode = mode;
  render();
}
function toggleLetterRecipient(maSo){
  const idx = S.modal.chosen.indexOf(maSo);
  if(idx>=0) S.modal.chosen.splice(idx,1); else S.modal.chosen.push(maSo);
  render();
}
function addLetterRow(){
  S.modal.rows.push({ nhan:'', giaTri:'' });
  render();
}
function removeLetterRow(idx){
  S.modal.rows.splice(idx,1);
  render();
}
function updateLetterField(field, val){
  S.modal[field] = val;
}
function updateLetterRow(idx, field, val){
  S.modal.rows[idx][field] = val;
}
async function saveLetter(e){
  e.preventDefault();
  if(!hasPerm('guiThu')) return;
  const f = e.target;
  const nhan = f.nhan.value.trim() || 'THÔNG BÁO';
  const tieuDePhu = f.tieuDePhu.value.trim();
  const tenChinh = f.tenChinh.value.trim();
  const chip = f.chip.value.trim();
  const loiNhan = f.loiNhan.value.trim();
  const nutXacNhan = f.nutXacNhan.value.trim() || 'Đã nhận thông báo';
  if(!tenChinh){ showToast('Vui lòng nhập tiêu đề / tên chính của thư.'); return; }
  if(S.modal.recipientMode === 'chon' && S.modal.chosen.length === 0){ showToast('Vui lòng chọn ít nhất một người nhận.'); return; }
  const rows = S.modal.rows.filter(r => r.nhan.trim() || r.giaTri.trim());
  const letter = {
    id: uid(),
    tuMaSo: S.currentUser.maSo,
    tuHoTen: S.currentUser.hoTen,
    nguoiNhan: S.modal.recipientMode === 'all' ? 'all' : [...S.modal.chosen],
    nhan, tieuDePhu, tenChinh, chip,
    dongThongTin: rows,
    loiNhan, nutXacNhan,
    ngayTao: Date.now(),
    daXemBoi: []
  };
  S.letters = S.letters || [];
  S.letters.push(letter);
  S.modal = null;
  render();
  const ok = await safeSet('letters', S.letters, true);
  showToast(ok ? 'Đã gửi thư báo.' : 'Không lưu được, thử lại.');
}
async function deleteLetter(letterId){
  if(!hasPerm('guiThu')) return;
  S.letters = (S.letters || []).filter(l => l.id !== letterId);
  render();
  const ok = await safeSet('letters', S.letters, true);
  showToast(ok ? 'Đã xoá thư báo.' : 'Không lưu được, thử lại.');
}

async function editChurchName(){
  const name = prompt('Tên giáo xứ / đội lễ sinh:', S.settings.tenGiaoXu);
  if(name === null || !name.trim()) return;
  S.settings.tenGiaoXu = name.trim();
  render();
  await safeSet('settings', S.settings, true);
}

/* ---------------- Render ---------------- */
function render(){
  const app = document.getElementById('app');
  if(S.view === 'loading'){ app.innerHTML = `<div class="loading-note">Đang tải…</div>`; return; }
  if(S.view === 'setup'){ app.innerHTML = renderSetup(); attachSetup(); return; }
  if(S.view === 'login'){ app.innerHTML = renderLogin(); attachLogin(); return; }
  if(S.view === 'roster'){ app.innerHTML = renderShell(renderRoster()); return; }
  if(S.view === 'accounts'){
    if(!hasPerm('quanLyTaiKhoan')){ S.view = 'app'; app.innerHTML = renderShell(renderCalendarView()); attachModal(); return; }
    app.innerHTML = renderShell(renderAccounts()); attachAccountsHandlers(); attachModal(); return;
  }
  if(S.view === 'loginLogs'){
    if(!hasPerm('xemNhatKy')){ S.view = 'app'; app.innerHTML = renderShell(renderCalendarView()); attachModal(); return; }
    app.innerHTML = renderShell(renderLoginLogs()); return;
  }
  if(S.view === 'myLetters'){ app.innerHTML = renderShell(renderMyLetters()); attachModal(); return; }
  if(S.view === 'changePw'){ app.innerHTML = renderShell(renderChangePw()); attachChangePwHandlers(); return; }
  app.innerHTML = renderShell(renderCalendarView());
  attachModal();
}

function renderCalendarView(){
  const cells = buildCalendarCells();
  const tKey = todayKey();
  let gridHtml = '';
  cells.forEach(d => {
    if(d === null){ gridHtml += `<div class="cal-cell empty"></div>`; return; }
    const key = dateKey(S.calYear, S.calMonth, d);
    const masses = S.schedule[key] || [];
    const special = (S.specialDays && S.specialDays[key]) || null;
    const isToday = key === tKey;
    const isSelected = key === S.selectedDate;
    const iAmIn = masses.some(m => m.lezSinh.includes(S.currentUser.maSo));
    let chips = masses.slice(0,2).map(m => {
      const mine = m.lezSinh.includes(S.currentUser.maSo);
      return `<div class="chip ${mine?'mine':''}">${m.gio} · ${m.lezSinh.length} lễ sinh</div>`;
    }).join('');
    if(masses.length > 2) chips += `<div class="chip">+${masses.length-2} buổi khác</div>`;
    const dots = masses.slice(0,6).map(m => {
      const mine = m.lezSinh.includes(S.currentUser.maSo);
      return `<span class="dot ${mine?'mine':''}"></span>`;
    }).join('');
    const cellStyle = special ? ` style="background:${special.mau};"` : '';
    gridHtml += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''} ${iAmIn?'has-me':''}"${cellStyle} onclick="selectDate('${key}')">
      <div class="datenum">${d}</div>
      ${special ? `<div class="special-tag" title="${special.ghiChu}">${special.ghiChu}</div>` : ''}
      ${chips}
      <div class="mobile-dots">${dots}</div>
      ${isToday ? `<div class="flame"></div>` : ''}
    </div>`;
  });

  return `
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <h2>${MONTH_NAMES[S.calMonth]} ${S.calYear}</h2>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <div class="content-grid">
    <div class="calendar-col">
      <div class="weekdays">${WEEKDAYS.map(w=>`<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">${gridHtml}</div>
    </div>
    <div class="detail-col">
      ${renderDetailPanel()}
    </div>
  </div>`;
}

function renderDetailPanel(){
  if(!S.selectedDate){
    return `<div class="panel"><div class="empty-note">Chọn một ngày trên lịch để xem chi tiết buổi lễ và lễ sinh được phân công.</div></div>`;
  }
  const masses = S.schedule[S.selectedDate] || [];
  const special = (S.specialDays && S.specialDays[S.selectedDate]) || null;
  const [y,m,d] = S.selectedDate.split('-').map(Number);
  const niceDate = `${d}/${m}/${y}`;
  let html = `<div class="panel">
    <h3>Ngày ${niceDate}</h3>
    ${special ? `<div class="special-note-box" style="background:${special.mau};">🎨 ${special.ghiChu}</div>` : ''}
    <p class="panel-sub">${masses.length} buổi lễ được xếp lịch</p>`;
  if(masses.length === 0){
    html += `<div class="empty-note">Chưa có buổi lễ nào trong ngày này.</div>`;
  } else {
    masses.forEach(mItem => {
      html += `<div class="mass-item">
        <div class="mass-time">${mItem.gio}</div>
        ${mItem.ghiChu ? `<div class="mass-note">${mItem.ghiChu}</div>` : ''}
        <div>${mItem.lezSinh.length === 0 ? '<span class="empty-note" style="padding:4px 0;display:block;">Chưa có lễ sinh</span>' : mItem.lezSinh.map(maSo => {
          const u = S.users[maSo];
          const name = u ? u.hoTen : maSo;
          return `<span class="name-tag">${name}${canEditSchedule() ? `<button onclick="removePersonFromMass('${mItem.id}','${maSo}')" title="Bỏ khỏi buổi lễ">✕</button>` : ''}</span>`;
        }).join('')}</div>
        ${canEditSchedule() ? `<div style="margin-top:8px;display:flex;gap:8px;">
          <button class="btn btn-ghost btn-sm" onclick="openAddPerson('${mItem.id}')">+ Thêm lễ sinh</button>
          <button class="btn btn-danger btn-sm" onclick="removeMass('${mItem.id}')">Xoá buổi lễ</button>
        </div>` : ''}
      </div>`;
    });
  }
  if(canEditSchedule()){
    html += `<button class="btn btn-ghost" style="width:100%;margin-top:6px;" onclick="openAddMass()">+ Thêm buổi lễ</button>`;
  }
  if(isAdmin()){
    html += `<button class="btn btn-ghost" style="width:100%;margin-top:8px;" onclick="openSpecialDay()">${special ? '🎨 Sửa ngày đặc biệt' : '🎨 Đánh dấu ngày đặc biệt'}</button>`;
  }
  html += `</div>`;
  return html;
}

function letterContentHtml(letter, animate){
  const rowsHtml = (letter.dongThongTin || []).filter(r=>r.nhan||r.giaTri).map(r =>
    `<div class="lr"><span class="lr-label">${r.nhan}</span><span class="lr-value">${r.giaTri}</span></div>`).join('');
  const initials = (letter.tenChinh || '?').trim().split(/\s+/).slice(-1)[0].charAt(0).toUpperCase();
  let delay = 0;
  const step = (html, extraDelay) => { const d = animate ? `style="animation-delay:${delay}s"` : ''; delay += (extraDelay||0.12); return `<div class="letter-line" ${d}>${html}</div>`; };
  return `
    <div class="letter-corner tl"></div><div class="letter-corner tr"></div><div class="letter-corner bl"></div><div class="letter-corner br"></div>
    ${step(`<div class="letter-badge">${letter.nhan}</div>`)}
    ${step(`<div class="letter-avatar">${initials}</div>`)}
    ${step(`<div class="letter-deco">✦ ● ✦</div>`)}
    ${letter.tieuDePhu ? step(`<div class="letter-subtitle">${letter.tieuDePhu}</div>`) : ''}
    ${step(`<div class="letter-name">${letter.tenChinh}</div>`)}
    ${letter.chip ? step(`<div class="letter-chip">🛡️ ${letter.chip}</div>`) : ''}
    ${rowsHtml ? step(`<div class="letter-rows">${rowsHtml}</div>`) : ''}
    ${letter.loiNhan ? step(`<div class="letter-message">${letter.loiNhan}</div>`) : ''}
    ${step(`<button class="letter-confirm-btn" onclick="closeLetterView()">✓ ${letter.nutXacNhan}</button>`)}
    ${step(`<div class="letter-from">Từ: ${letter.tuHoTen}</div>`)}
  `;
}

      <div class="field"><label>Chữ trên nút xác nhận</label><input name="nutXacNhan" placeholder="VD: Đã nhận bổ nhiệm" value="${S.modal.nutXacNhan}" oninput="updateLetterField('nutXacNhan',this.value)"></div>
      <div class="field">

          <button type="button" class="btn ${S.modal.recipientMode==='chon'?'btn-primary':'btn-ghost'} btn-sm" onclick="setLetterRecipientMode('chon')">Chọn người nhận</button>

          <label><input type="checkbox" onchange="toggleLetterRecipient('${maSo}')" ${S.modal.chosen.includes(maSo)?'checked':''}> <span class="cl-name">${u.hoTen} <span class="mono" style="color:var(--ink-soft);">(${maSo})</span></span></label>
        `).join('')}</div>` : ''}
      </div>
      <div class="row-btns">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Huỷ</button>

/* ---------------- Modals ---------------- */
function userChecklist(excludeSelected){
  const entries = Object.entries(S.users);
  return `<div class="checklist">${entries.map(([maSo,u]) => `
    <label><input type="checkbox" onchange="toggleChosen('${maSo}')" ${S.modal.chosen && S.modal.chosen.includes(maSo)?'checked':''}> <span class="cl-name">${u.hoTen} <span class="mono" style="color:var(--ink-soft);">(${maSo})</span></span></label>
  `).join('')}</div>`;

function attachModal(){
  if(!S.modal) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };

  let inner = '';
  if(S.modal.type === 'addMass'){
    inner = `<div class="modal-box">
      <h3>Thêm buổi lễ</h3>
      <form id="massForm">
        <div class="field"><label>Giờ lễ</label><input name="gio" type="time" required></div>
        <div class="field"><label>Ghi chú (tuỳ chọn)</label><input name="ghiChu" placeholder="VD: Lễ Chúa Nhật"></div>
        <div class="field"><label>Chọn lễ sinh tham gia</label>${userChecklist()}</div>
        <div class="row-btns">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Huỷ</button>
          <button type="submit" class="btn btn-primary">Lưu buổi lễ</button>
        </div>
      </form>
    </div>`;
  } else if(S.modal.type === 'addPerson'){
    inner = `<div class="modal-box">
      <h3>Thêm lễ sinh vào buổi lễ</h3>
      <form id="addPersonForm">
        ${userChecklist()}
        <div class="row-btns">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Huỷ</button>
          <button type="submit" class="btn btn-primary">Thêm</button>
        </div>
      </form>
    </div>`;
  } else if(S.modal.type === 'addUser'){
    inner = `<div class="modal-box">
      <h3>Thêm tài khoản lễ sinh</h3>
      <form id="addUserForm">
        <div class="field"><label>Họ tên</label><input name="hoTen" required></div>
        <div class="field"><label>Mã số đăng nhập</label><input name="maSo" class="mono" required></div>
        <div class="field"><label>Mật khẩu</label><input name="matKhau" type="password" required></div>
        <p class="hint-text" style="margin-top:0;">Tài khoản mới sẽ là lễ sinh thường. Bạn có thể cấp quyền hỗ trợ chỉnh lịch sau trong danh sách tài khoản.</p>
        <div class="row-btns">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Huỷ</button>
          <button type="submit" class="btn btn-primary">Thêm tài khoản</button>
        </div>
      </form>
    </div>`;
  } else if(S.modal.type === 'resetPw'){
    inner = `<div class="modal-box">
      <h3>Đổi mật khẩu cho ${S.users[S.modal.maSo].hoTen}</h3>
      <form id="resetPwForm">
        <div class="field"><label>Mật khẩu mới</label><input name="matKhau" type="password" required></div>
        <div class="row-btns">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Huỷ</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>`;
  } else if(S.modal.type === 'specialDay'){
    const presets = [
      { hex:'#F7D4DE', label:'Hồng · Lễ cưới' },
      { hex:'#FCE8B2', label:'Vàng · Lễ trọng' },
      { hex:'#D7E6D2', label:'Xanh lá' },
      { hex:'#D7E0F0', label:'Xanh dương' },
      { hex:'#E6D7F0', label:'Tím · Lễ tang' }
    ];
    const hasExisting = !!(S.specialDays && S.specialDays[S.selectedDate]);
    const initRgb = hexToRgb(S.modal.mau);
    inner = `<div class="modal-box">
      <h3>Đánh dấu ngày đặc biệt</h3>
      <form id="specialDayForm">
        <div class="field"><label>Ghi chú</label><input name="ghiChu" placeholder="VD: Lễ cưới" value="${S.modal.ghiChu || ''}" required></div>
        <div class="field">
          <label>Màu ô lịch</label>
          <input name="mau" type="color" value="${S.modal.mau}" oninput="syncSlidersFromColorInput()" style="width:60px;height:36px;padding:2px;border:1px solid var(--border);border-radius:8px;">
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
            ${presets.map(p => `<button type="button" class="color-swatch" title="${p.label}" onclick="setPresetColor('${p.hex}')" style="background:${p.hex};"></button>`).join('')}
          </div>
          <div class="rgb-box">
            <div class="rgb-row r"><span class="rgb-label">R</span><input id="sdR" type="range" min="0" max="255" value="${initRgb.r}" oninput="updateColorFromSliders()"><span class="rgb-val" id="sdRVal">${initRgb.r}</span></div>
            <div class="rgb-row g"><span class="rgb-label">G</span><input id="sdG" type="range" min="0" max="255" value="${initRgb.g}" oninput="updateColorFromSliders()"><span class="rgb-val" id="sdGVal">${initRgb.g}</span></div>
            <div class="rgb-row b"><span class="rgb-label">B</span><input id="sdB" type="range" min="0" max="255" value="${initRgb.b}" oninput="updateColorFromSliders()"><span class="rgb-val" id="sdBVal">${initRgb.b}</span></div>
            <div class="rgb-preview" id="sdPreview" style="background:${S.modal.mau};"></div>
          </div>
        </div>
        <div class="row-btns">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Huỷ</button>
          ${hasExisting ? `<button type="button" class="btn btn-danger" onclick="removeSpecialDay()">Bỏ đánh dấu</button>` : ''}
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>`;
  } else if(S.modal.type === 'letterEnvelope'){
    const letter = (S.letters || []).find(l => l.id === S.modal.letterId);
    if(!letter){ S.modal = null; render(); return; }
    overlay.className = 'envelope-overlay-wrap';
    overlay.onclick = null;
    inner = renderEnvelopeOverlay(letter);
  } else if(S.modal.type === 'letterOpen'){
    const letter = (S.letters || []).find(l => l.id === S.modal.letterId);
    if(!letter){ S.modal = null; render(); return; }
    overlay.className = 'envelope-overlay-wrap';
    overlay.onclick = (e) => { if(e.target === overlay) closeLetterView(); };
    inner = renderLetterOverlay(letter);
  } else if(S.modal.type === 'composeLetter'){
    if(!hasPerm('guiThu')){ S.modal = null; render(); return; }
    inner = renderComposeLetterForm();
  } else if(S.modal.type === 'roleForm'){
    if(!isAdmin()){ S.modal = null; render(); return; }
    inner = renderRoleForm();
  }
  overlay.innerHTML = inner;
  document.getElementById('app').appendChild(overlay);

  if(S.modal.type === 'addMass') document.getElementById('massForm').addEventListener('submit', saveMass);
  if(S.modal.type === 'addPerson') document.getElementById('addPersonForm').addEventListener('submit', saveAddPerson);
  if(S.modal.type === 'addUser') document.getElementById('addUserForm').addEventListener('submit', saveAddUser);
  if(S.modal.type === 'resetPw') document.getElementById('resetPwForm').addEventListener('submit', saveResetPassword);
  if(S.modal.type === 'specialDay') document.getElementById('specialDayForm').addEventListener('submit', saveSpecialDay);
  if(S.modal.type === 'composeLetter') document.getElementById('composeLetterForm').addEventListener('submit', saveLetter);
  if(S.modal.type === 'roleForm') document.getElementById('roleForm').addEventListener('submit', saveRole);
}

window.addEventListener('firebase-ready', init, { once: true });

</script>
